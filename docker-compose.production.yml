version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: kct_crm_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-edtech_crm}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-edtech_crm}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: kct_crm_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kct_crm_backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      PROJECT_NAME: ${PROJECT_NAME:-Kiwi Cloud Tech CRM}
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-edtech_crm}
      REDIS_URL: redis://redis:6379/0
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-20}
      DB_POOL_RECYCLE: ${DB_POOL_RECYCLE:-1800}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-30}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-https://crm.kiwicloudtech.co.in}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_LOGIN_PER_MINUTE: ${RATE_LIMIT_LOGIN_PER_MINUTE:-10}
      RATE_LIMIT_AI_PER_MINUTE: ${RATE_LIMIT_AI_PER_MINUTE:-30}
      RATE_LIMIT_COMM_PER_MINUTE: ${RATE_LIMIT_COMM_PER_MINUTE:-20}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-none}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Kiwi Cloud Tech}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-}
      MAIL_SMTP_HOST: ${MAIL_SMTP_HOST:-}
      MAIL_SMTP_PORT: ${MAIL_SMTP_PORT:-465}
      MAIL_SMTP_SECURITY: ${MAIL_SMTP_SECURITY:-none}
      MAIL_SMTP_USERNAME: ${MAIL_SMTP_USERNAME:-}
      MAIL_SMTP_PASSWORD: ${MAIL_SMTP_PASSWORD:-}
      MAIL_IMAP_HOST: ${MAIL_IMAP_HOST:-}
      MAIL_IMAP_PORT: ${MAIL_IMAP_PORT:-993}
      MAIL_IMAP_SECURITY: ${MAIL_IMAP_SECURITY:-none}
      MAIL_IMAP_USERNAME: ${MAIL_IMAP_USERNAME:-}
      MAIL_IMAP_PASSWORD: ${MAIL_IMAP_PASSWORD:-}
      TELEPHONY_ENABLED: ${TELEPHONY_ENABLED:-false}
      TELEPHONY_PROVIDER: ${TELEPHONY_PROVIDER:-none}
      TELEPHONY_BUSINESS_NUMBER: ${TELEPHONY_BUSINESS_NUMBER:-}
      COMM_NOTIFICATION_EMAILS_ENABLED: ${COMM_NOTIFICATION_EMAILS_ENABLED:-false}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
    volumes:
      - ./uploads:/app/uploads
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.crm.kiwicloudtech.co.in/api/v1}
    container_name: kct_crm_frontend
    restart: unless-stopped
    expose:
      - "3000"
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: kct_crm_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.production.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  redis_data:
