databases:
  - name: edtech-crm-db
    databaseName: edtech_crm
    user: edtech_crm
    plan: free
    region: oregon
    postgresMajorVersion: 16

services:
  - type: web
    name: edtech-crm-backend
    runtime: python
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python run_migrations.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: PROJECT_NAME
        value: EdTech Enterprise CRM
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: edtech-crm-db
          property: connectionString
      - key: BACKEND_CORS_ORIGINS
        value: "https://edtech-crm-frontend.vercel.app"
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_MAX_OVERFLOW
        value: "10"
      - key: AI_PROVIDER
        value: mock
